# Alembic config — Story 0.2
# Source-of-truth:  apps/api/alembic/versions/0001_tenants_users_memberships_settings.py
# RLS policies live in: supabase/policies/0001_rls_policies.sql (applied AFTER alembic upgrade)

[alembic]
script_location = apps/api/alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

# Alembic uses a sync driver for migrations (asyncpg requires async runners).
# Pulled from DATABASE_URL at runtime in env.py if not set here.
# Example: postgresql://postgres:postgres@localhost:54322/postgres

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
