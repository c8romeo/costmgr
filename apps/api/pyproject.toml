[project]
name = "costmgr-api"
version = "0.1.0"
description = "bizup API — FastAPI modular monolith"
requires-python = ">=3.12,<3.13"
readme = "README.md"

# ─────────────────────────────────────────────────────────────────────────
# FASTAPI-1 (CR 2026-07-25): fastapi moved from [dev] extras to production
# deps — the runtime image imports it, so a production install without
# [dev] extras would otherwise break. Pydantic stays pinned (RANGE-1:
# pydantic==2.11.9, last 2.11.x before PYD-1 broken 2.13.x wheel).
# ─────────────────────────────────────────────────────────────────────────
dependencies = [
    # Story 0.2 — Supabase + Postgres + JWT
    "sqlalchemy==2.0.36",       # AD-14 exact pin
    "asyncpg==0.30.0",          # async Postgres driver
    "alembic==1.18.5",          # migrations
    "pyjwt==2.10.1",            # HS256 JWT decoder
    "pydantic-settings==2.6.1", # settings.py base
    "supabase==2.10.0",         # auth.admin.* helpers (used in tests)
    # FastAPI is a runtime dependency (main:app = uvicorn target).
    "fastapi==0.139.2",         # spec line 125 (AD-14 exact pin)
    "uvicorn==0.32.0",          # ASGI server (CMD entrypoint in Dockerfile)
    "httpx==0.27.0",            # used by core clients + tests
    # pydantic/pydantic-core: pinned to 2.11.x (RANGE-1) — last known-good
    # before broken pydantic-core==2.46.4 wheel that ships with 2.13+ (PYD-1).
    "pydantic==2.11.9",         # AD-14 exact pin (was range >=2.10,<2.12)
    "pydantic-core==2.33.2",    # pydantic 2.11.9 resolves core≥2.33.2; 2.27.2 was incorrect (resolver runtime pick)
    # Story 12.1 (Epic 12 cj-style 1번째) — NFR6 AES-256-GCM column-level
    # encryption (users.totp_secret BYTEA + totp_recovery_codes_hash JSONB).
    # Pin exact minor version per AD-14 exact-pin policy.
    "cryptography==43.0.1",     # NFR6 AES-256-GCM at-rest encryption
    # Story Epic 15 — SSO enterprise SAML 2.0 validator (PRD §F17.3 + AD-28).
    # AD-14 exact pin: minor version frozen. python3-saml pulls in lxml
    # + signxml as transitive deps; both are pinned in the lockfile.
    "python3-saml==1.16.0",  # SSO SAML 2.0 response validation (Epic 15)
    # Epic 16 — IdP metadata XML validator (PRD §F19.2 + AD-30).
    # lxml is OPTIONAL — the validator uses stdlib xml.etree.ElementTree
    # for the 8-step validation surface. Pinned here as a forward-stack
    # pin for any future XML schema validation work (AD-14 stack pin).
    "lxml>=5.0.0",
    # Phase 7 (cj-style 91번째 wire) — Observability Stack 강화 (PRD §F23).
    # AD-14 stack pin — exact minor versions frozen.
    # OpenTelemetry distributed tracing (F23.1 + AD-34 (a) sub-decision).
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-exporter-otlp-proto-http==1.27.0",
    "opentelemetry-instrumentation-fastapi==0.48b0",
    "opentelemetry-instrumentation-sqlalchemy==0.48b0",
    "opentelemetry-instrumentation-httpx==0.48b0",
    "opentelemetry-instrumentation-asyncpg==0.48b0",
    # Prometheus custom metrics (F23.2 + AD-34 (b) sub-decision).
    "prometheus-client==0.20.0",
    # PyYAML for alert_rules.yaml config loading (F23.3).
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",     # spec line 130
]

[build-system]
# HATCH-1 (CR 2026-07-25): hatchling pinned to a specific version (1.27.0),
# not "latest" — guarantees reproducible builds per AD-14.
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Production wheel needs the whole package, not just subpackages.
# apps/api/{__init__,main}.py + apps/api/{core,modules}/ together form the package.
# Editable install (uv workspace) doesn't read this; production does.
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
