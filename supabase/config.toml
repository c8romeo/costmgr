# Supabase local config — Story 0.2
# `supabase start` uses this to boot the local stack on localhost:54322.
# Per AD-9: region pinned to ap-northeast-2 (Seoul). Local stack ignores
# region; this is informational for documentation.

project_id = "costmgr-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = false          # tenant invite-only (Story 1.1)

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.hook.custom_access_token]
# Phase 3-0: hook enabled. The PL/pgSQL function
# `public.custom_access_token_hook` is created by alembic 0035.
# Without this enabled, every JWT mint carries an empty app_metadata
# → `apps.api.core.security.decode_jwt` rejects with
# `reason="no_tenant_id"` → every API request returns 401.
#
# Function contract (see apps/api/alembic/versions/0035_*.py):
#   - Reads tenant_memberships + tenants joined by auth.users.id
#   - Picks the highest-privilege membership (owner > member > viewer
#     > consultant_proxy), breaking ties by oldest joined_at
#   - Injects { tenant_id, role, industry } into claims.app_metadata
#   - SECURITY DEFINER so the read is not blocked by RLS during mint
#     (no user session exists yet at hook time)
#   - STABLE — pure read, no DB writes
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
