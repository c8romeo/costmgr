# costmgr — Railway backend deployment config
#
# Phase 4 (cj-style 55번째 epic 연속 정직 회복 wire)
# AD-27 verbatim: Railway backend (FastAPI + Dockerfile + health check endpoint)
# healthcheckPath = "/api/v1/health" 정합 sweep with apps/api/core/health.py (Phase 4 T5 wire)
#
# Re-run digest refresh on:
#   - Python major version bump
#   - Railway runtime EOL announcement
#   - Supply-chain security advisory

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
# Required: Supabase connection
DATABASE_URL = "${DATABASE_URL}"
SUPABASE_URL = "${SUPABASE_URL}"
SUPABASE_ANON_KEY = "${SUPABASE_ANON_KEY}"
SUPABASE_SERVICE_ROLE_KEY = "${SUPABASE_SERVICE_ROLE_KEY}"
SUPABASE_JWT_SECRET = "${SUPABASE_JWT_SECRET}"
# Required: Sentry observability (server side)
SENTRY_DSN = "${SENTRY_DSN}"
# cj-304 wire sprint — Email delivery (cj-299 OQ-EPIC30+-2 Postmark 결정 wire).
# POSTMARK_SERVER_TOKEN mandatory for production email dispatch.
# POSTMARK_FROM_EMAIL 운영자 override 가능 (default: noreply@costmgr.bizup.io).
POSTMARK_SERVER_TOKEN = "${POSTMARK_SERVER_TOKEN}"
POSTMARK_FROM_EMAIL = "${POSTMARK_FROM_EMAIL}"
# cj-304 wire sprint — Scheduled reports (cj-300 OQ-EPIC30+-3 APScheduler 결정 wire).
# TZ=Asia/Seoul mandatory (Railway 기본 UTC → 24h cron 오프셋 방지).
# RETRY_BACKOFF_MINUTES exponential backoff (1min → 5min → 30min, 3 retries).
TZ = "${TZ}"
RETRY_BACKOFF_MINUTES = "${RETRY_BACKOFF_MINUTES}"
ENVIRONMENT = "production"
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
PORT = "8000"

[[services]]
name = "costmgr-api"
source = "."
# Internal Railway healthcheck is satisfied by healthcheckPath above.
# Railway re-runs the container command below on healthcheckTimeout expiration.
command = ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]