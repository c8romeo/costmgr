# Phase 8 / §F24.6 — Cost engine benchmark V8 golden_diff detector.
#
# Triggers: PR (cost engine modules) + workflow_dispatch + nightly KST 02:00 cron.
# V8 golden fixture + result_hash tenant-scoped (CR 4-3/4-4 verbatim).
# regression_threshold_pct=5.0 verbatim.
name: cost-engine-benchmark

on:
  pull_request:
    paths:
      - "apps/api/modules/abc/**"
      - "apps/api/modules/tdabc/**"
      - "apps/api/modules/m3_calculate/**"
      - "apps/api/modules/m10_ai_extraction/**"
      - "packages/cost_engine/**"
      - "tests/performance/golden/cost-engine-v8.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode (no PR block)"
        required: false
        type: boolean
        default: true
  schedule:
    # Nightly KST 02:00 (UTC 17:00)
    - cron: "0 17 * * *"

jobs:
  benchmark-golden-diff:
    name: Cost engine V8 benchmark golden_diff
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate V8 golden fixture
        run: |
          cd apps/api
          python -c "
          import json
          with open('../../tests/performance/golden/cost-engine-v8.json') as f:
              data = json.load(f)
          assert data['regression_threshold_pct'] == 5.0
          assert 'abc_p99_ms' in data
          assert 'tdabc_p99_ms' in data
          assert 'ai_extraction_p99_ms' in data
          print('V8 golden fixture valid')
          "

      - name: Comment on PR with benchmark result
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🟡 **Cost Engine V8 Benchmark**: golden_diff detector PASS. regression_threshold_pct=5.0 verbatim.'
            })
