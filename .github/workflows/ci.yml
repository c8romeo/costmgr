name: ci

# Trigger surface (cj-style 212 EXTENSION):
# - push / pull_request on `main` (legacy canonical branch — verbatim preserved)
# - push / pull_request on `9-3-*` (cj-style working branches, current epic
#   territory — cj-209 → cj-210 → cj-211 → cj-212 recovery chain 의 working
#   surface)
# - push / pull_request on `story-*` (story development branches)
# - workflow_dispatch (manual trigger for explicit verification — defensive
#   fallback)
#
# Rationale (cj-212 결정 wire):
# cj-209 PARTIAL → cj-210 BLOCKED (ci.yml setup SHA unresolvable) → cj-211
# SHA fix RESOLVED 결정 wire 보존. cj-211 의 source-side fix 후 live CI
# run trigger → setup recovery → downstream jobs trigger cycle 의
# verification 을 가능케 하려면 trigger surface 자체가 working branch 에서
# trigger 되어야 함. cj-210 blocker A (`branches: [main]` 으로 인한
# non-main branch push 미 trigger) 해소 결정 wire.
on:
  push:
    branches:
      - main
      - '9-3-*'
      - 'story-*'
  pull_request:
    branches:
      - main
      - '9-3-*'
      - 'story-*'
  workflow_dispatch:

# CI-3 (CR 2026-07-25): do NOT cancel in-progress on PR builds — the
# stack-pin-check must complete to record drift annotations. On push to
# main, cancellation is fine (only the latest commit matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. setup (shared cache)
  # ─────────────────────────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: ".nvmrc"
      # CI-COREPACK-1 (cj-style 213): Node.js corepack 으로 package.json 의
      # `packageManager: pnpm@9.15.4` 를 자동 provisioning. setup node 후
      # pnpm 사용 직전에 1회 enable. cj-212 의 trigger surface EXTENSION 으로
      # live trigger cycle 이 회복된 후 Install JS deps step 의 exit 127
      # (`pnpm: command not found`) blocker 해소.
      - name: Enable corepack (provides pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version-file: ".python-version"
      - name: Install uv
        run: pip install uv==0.11.32
      - name: Cache uv
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4.2.1
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - name: Cache pnpm
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4.2.1
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Install Python deps
        run: uv sync --frozen

  # ─────────────────────────────────────────────────────────
  # 2. lint-deps (dependency-cruiser, Story 0.1)
  # ─────────────────────────────────────────────────────────
  lint-deps:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: ".nvmrc" }
      - name: Enable corepack (provides pnpm from packageManager field)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:deps

  # ─────────────────────────────────────────────────────────
  # 3. lint-imports (import-linter, Story 0.1)
  # ─────────────────────────────────────────────────────────
  lint-imports:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with: { python-version-file: ".python-version" }
      - run: pip install uv==0.11.32
      - run: uv sync --frozen
      - name: Run import-linter
        run: uv run import-linter lint

  # ─────────────────────────────────────────────────────────
  # 4. lint-conventions (Story 0.4 — AD-8 monetary + AD-15 naming)
  # ─────────────────────────────────────────────────────────
  # Runs ruff (Python) + ESLint (TypeScript) + custom money-type linter +
  # migration linters. Failure message includes violated AD reference.
  lint-conventions:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: ".nvmrc" }
      # cj-style 219 (D-CI-FUNC-1): corepack enable 누락 → pnpm: command not found (exit 127).
      # setup, stack-pin-check, commit-prefix-lint, web-test, web-e2e jobs 는 보유하나 lint-conventions 만
      # 미보유 → 다른 job 들과 동일하게 Enable corepack step 추가.
      - name: Enable corepack (provides pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with: { python-version-file: ".python-version" }
      - run: pip install uv==0.11.32
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - name: Run lint-conventions (ruff + custom money + migration linters)
        run: make lint-conventions
        env:
          PYTHONIOENCODING: utf-8
      - name: Annotate convention violation on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const msg = 'CONVENTION_VIOLATION detected. Check ruff / ESLint / money-type / migration linter output for the violated AD reference (AD-8 or AD-15).';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: msg,
            });

  # ─────────────────────────────────────────────────────────
  # 5. stack-pin-check (Story 0.3 — AD-14 lockfile guard)
  # ─────────────────────────────────────────────────────────
  stack-pin-check:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # fetch-depth: 0 so `git log -1` sees the full commit message
          fetch-depth: 0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: ".nvmrc" }
      - name: Enable corepack (provides pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with: { python-version-file: ".python-version" }
      - run: pip install uv==0.11.32
      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile
      - name: Install Python deps (frozen)
        run: uv sync --frozen
      # CI-1 (CR 2026-07-25): For PR builds, the HEAD commit is the merge
      # commit (squash-merge workflow). The `[STACK BUMP]` tag lives on the
      # PR's actual head commit. Pass it via env var so the check scripts
      # can authorize drift using the PR commit, not the merge commit.
      - name: Compute PR head commit (for [STACK BUMP] authorization)
        if: github.event_name == 'pull_request'
        id: pr_head
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Node pin check
        id: node_check
        run: |
          set +e
          if [ -n "${{ steps.pr_head.outputs.head_sha }}" ]; then
            node scripts/check_stack_pin.mjs
            exit_code=$?
          else
            node scripts/check_stack_pin.mjs
            exit_code=$?
          fi
          echo "exit=$exit_code"
          exit $exit_code
        env:
          PYTHONIOENCODING: utf-8
          # When on a PR, prefer the PR head commit for the bump-tag check.
          STACK_BUMP_PR_HEAD_SHA: ${{ steps.pr_head.outputs.head_sha }}
      - name: Python pin check
        id: py_check
        run: |
          set +e
          uv run python scripts/check_stack_pin.py
          exit_code=$?
          echo "exit=$exit_code"
          exit $exit_code
        env:
          PYTHONIOENCODING: utf-8
          STACK_BUMP_PR_HEAD_SHA: ${{ steps.pr_head.outputs.head_sha }}
      - name: Annotate drift on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const drift = 'STACK_PIN_VIOLATION detected. Add `[STACK BUMP]` to the PR commit message to authorize this drift.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: drift,
            });
      # LABEL-1 (CR 2026-07-25): auto-apply `stack-pin-violation` label when
      # the check fails, so branch protection can block merge per spec AC #3.
      - name: Apply stack-pin-violation label
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['stack-pin-violation'],
              });
            } catch (e) {
              core.warning(`Failed to apply label: ${e.message}`);
            }

  # ─────────────────────────────────────────────────────────
  # 5. commit-prefix-lint (Story 9.7 — A36 wire, D5 fix)
  # ─────────────────────────────────────────────────────────
  commit-prefix-lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # fetch-depth: 0 so `git log -1` sees the full commit message
          fetch-depth: 0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: ".nvmrc" }
      - name: Enable corepack (provides pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with: { python-version-file: ".python-version" }
      - run: pip install uv==0.11.32
      - name: Compute PR head commit (for [STACK BUMP] bypass)
        if: github.event_name == 'pull_request'
        id: pr_head
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Node commit prefix check
        id: node_prefix_check
        run: |
          set +e
          node scripts/check_commit_prefix.mjs
          exit_code=$?
          echo "exit=$exit_code"
          exit $exit_code
        env:
          PYTHONIOENCODING: utf-8
          COMMIT_PREFIX_BYPASS_PR_HEAD_SHA: ${{ steps.pr_head.outputs.head_sha }}
      - name: Python commit prefix check
        id: py_prefix_check
        run: |
          set +e
          uv run python scripts/check_commit_prefix.py
          exit_code=$?
          echo "exit=$exit_code"
          exit $exit_code
        env:
          PYTHONIOENCODING: utf-8
          COMMIT_PREFIX_BYPASS_PR_HEAD_SHA: ${{ steps.pr_head.outputs.head_sha }}
      - name: Annotate violation on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const msg = 'COMMIT_PREFIX_VIOLATION detected. Commit subject starts with `@` (PowerShell here-string artifact). Use `git commit -F <file>` instead of `@\'...\'@`. Add `[STACK BUMP]` to commit subject to bypass.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: msg,
            });
      - name: Apply commit-prefix-violation label
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['commit-prefix-violation'],
              });
            } catch (e) {
              core.warning(`Failed to apply label: ${e.message}`);
            }

  # ─────────────────────────────────────────────────────────
  # 6. test-architecture (Story 0.1 — pytest fixture tests)
  # ─────────────────────────────────────────────────────────
  test-architecture:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with: { python-version-file: ".python-version" }
      - run: pip install uv==0.11.32
      # cj-style 245 (D-CI-FUNC-2 #5 test-architecture): workspace sync gap.
      # `uv sync --frozen` at workspace root installs only the root dev
      # group (14 packages) — apps/api member deps (fastapi, sqlalchemy,
      # pydantic, ...) absent. Collection of `tests/cost_engine` reaches
      # `apps/api/modules/m3_calculate/handlers.py:37` → `from fastapi
      # import` → `ModuleNotFoundError: No module named 'fastapi'` (run
      # 33401467136). `--all-packages` syncs all workspace members so
      # fastapi + sqlalchemy become available for import.
      - run: uv sync --frozen --all-packages
      - name: Run architecture + engine-purity tests
        run: uv run pytest tests/architecture tests/cost_engine -v

  # ─────────────────────────────────────────────────────────
  # 6. test-service-role-guard (Story 0.2 — pure unit tests)
  # ─────────────────────────────────────────────────────────
  test-service-role-guard:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with: { python-version-file: ".python-version" }
      - run: pip install uv==0.11.32
      # cj-style 245 (D-CI-FUNC-3 #6 test-service-role-guard): workspace
      # sync gap. `uv sync --frozen` at workspace root installs only the
      # root dev group (14 packages) — apps/api member deps (asyncpg, ...)
      # absent. `tests/rls/conftest.py:31` runs `import asyncpg` at
      # conftest load → `ModuleNotFoundError: No module named 'asyncpg'`
      # (run 33401467136). `--all-packages` syncs all workspace members
      # so asyncpg becomes available for conftest import.
      - run: uv sync --frozen --all-packages
      - name: Service-role audit-first unit tests (no DB required)
        run: uv run pytest tests/rls/test_service_role_audit.py -v

  # ─────────────────────────────────────────────────────────
  # 7. service-role-guard-lint (Story 0.2 — Task 7.4)
  # ─────────────────────────────────────────────────────────
  service-role-guard-lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail if `service_role` is invoked outside the guard module
        run: |
          # Operational references: function calls to with_service_role or
          # run_with_service_role, or the JWT role string "service_role"
          # used as a value. These indicate a caller is bypassing the guard.
          # Doc/env-var/module-path/comment references are exempt.
          PATTERN='with_service_role\(|run_with_service_role\(|\bservice_role\b\s*[=)]|"\s*service_role\s*"'
          HITS=$(grep -rEn "$PATTERN" apps/api/ --include="*.py" || true)
          # Strip comments and docstrings (lines whose first non-ws char
          # is # or lines that look like docstring text inside module
          # headers) — the migration file's bullet list lives inside a
          # triple-quoted module docstring.
          NON_DOC=$(echo "$HITS" | grep -v -E ':\s*#' || true)
          # Allow-list: the guard module, env-var name, audit helper, tenant
          # context, manifest, and the migration file (which documents
          # AD-2 audit policy references in its docstring).
          BAD=$(echo "$NON_DOC" \
              | grep -v 'apps/api/core/service_role.py' \
              | grep -v 'apps/api/core/settings.py' \
              | grep -v 'apps/api/core/audit.py' \
              | grep -v 'apps/api/core/tenant_context.py' \
              | grep -v 'apps/api/core/__init__.py' \
              | grep -v 'apps/api/alembic/versions/' \
              || true)
          if [ -n "$BAD" ]; then
            echo "❌ service_role invoked outside the guard module:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ service_role only invoked in apps/api/core/service_role.py"

  # ─────────────────────────────────────────────────────────
  # 8. rls-tests (Story 0.2 — tenant isolation, CI-only)
  # ─────────────────────────────────────────────────────────
  rls-tests:
    needs: setup
    runs-on: ubuntu-latest
    # Per Decision 2 (2026-07-25): Docker CI-only. Local dev is skipped.
    # DOCKER-2 (CR 2026-07-25): postgres:15 is pinned by digest to lock the
    # CI service image against silent drift.
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      # alembic env.py reads DATABASE_URL (RLS-CI-1). Use the asyncpg
      # driver so async_engine_from_config works (RLS-CI-2).
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:54322/postgres"
      # Tenant isolation tests run as costmgr_test (NOBYPASSRLS) so
      # RLS actually filters rows (RLS-CI-4).
      RLS_TEST_DATABASE_URL: "postgresql://costmgr_test:costmgr_test@localhost:54322/postgres"
      RLS_BOOTSTRAP_DATABASE_URL: "postgresql://postgres:postgres@localhost:54322/postgres"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with: { python-version-file: ".python-version" }
      - run: pip install uv==0.11.32
      # cj-style 223 (D-CI-FUNC-8 workspace sync fix): `uv sync --frozen` at
      # workspace root installs only the root dev group (14 packages) — NOT
      # apps/api member deps (alembic, sqlalchemy, asyncpg, fastapi, uvicorn,
      # supabase, pydantic, ...). Without `--all-packages`, `uv run alembic`
      # and `uv run uvicorn` fail with `Failed to spawn: ... (os error 2)`.
      # `--all-packages` syncs all workspace members (apps/api, packages/*)
      # so alembic + uvicorn become available.
      - run: uv sync --frozen --all-packages
      - name: Install psql
        run: |
          # cj-style 217 (D-CI-FUNC-6): explicit sudo + visible stderr + verification.
          # rls-tests job (Story 0.2 — CI-only RLS verification). The previous
          # `apt-get update -qq && apt-get install -y -qq postgresql-client >/dev/null`
          # pattern completed in <1s with FAIL conclusion (run_id 33235390055,
          # job_id 13, step 7) — `>/dev/null` swallowed all diagnostics.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version
      # cj-style 224 (D-CI-FUNC-8 alembic_version VARCHAR(32) blocker): alembic
      # 1.18.5 hardcodes `Column("version_num", String(32), nullable=False)` in
      # `alembic/ddl/impl.py:173` — auto-created `alembic_version.version_num`
      # column is always VARCHAR(32). However, 5 of 59 revision IDs exceed 32
      # chars (`0011_monthly_input_periods_opening_inventory` 44, `0002_tenant_
      # settings_onboarding_defaults` 40, `0001_tenants_users_memberships_set
      # tings` 39, `0037_epic_15_sso_external_identities` 36, `0010_monthly_in
      # put_labor_breakdown` 34). After cj-223's workspace sync fix, `alembic
      # upgrade head` finally attempts the first INSERT — `INSERT INTO alembic
      # _version (version_num) VALUES ('0001_tenants_users_memberships_settings')
      # ` fails with `ERROR: value too long for type character varying(32)`
      # because 39 > 32. Fix: pre-create `alembic_version` with VARCHAR(64)
      # before `alembic upgrade head` (`CREATE TABLE IF NOT EXISTS` makes
      # alembic's auto-create a silent no-op). Pure YAML-only change — no
      # alembic version files touched, no alembic graph topology change,
      # revision IDs preserved (matches cj-223 minimal-scope pattern).
      - name: Apply Supabase CI shim (auth.jwt() stub + service_role + costmgr_test roles)
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -f supabase/policies/0000_supabase_ci_shim.sql
      - name: Pre-create alembic_version (VARCHAR(64))
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -c "CREATE TABLE IF NOT EXISTS alembic_version \
                (version_num VARCHAR(64) NOT NULL PRIMARY KEY)"
      - name: Apply Alembic migration
        run: uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Apply RLS policies
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -f supabase/policies/0001_rls_policies.sql
      - name: RLS smoke test
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -f supabase/policies/0002_rls_smoke_test.sql
      - name: Run RLS tests
        run: uv run pytest tests/rls -v --tb=short --junitxml=pytest-rls.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: rls-test-results
          path: |
            pytest-rls.xml
            .pytest_cache/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────
  # 9. web-test (Story 0.5 — vitest smoke)
  # ─────────────────────────────────────────────────────────
  web-test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: ".nvmrc" }
      - name: Enable corepack (provides pnpm from packageManager field)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: cd apps/web && pnpm lint:tsc
      - run: cd apps/web && pnpm lint:conventions
      # cj-269: pnpm 9.15.4 의 `test` builtin 은 `--run` 옵션 미지원 (사용법: `pnpm test [-- <args>...]`).
      # `pnpm test --run` 은 pnpm 자체가 파싱하다가 "Unknown option: 'run'" 즉시 실패 →
      # web-test step 8 이 0초 만에 fail 했던 진짜 원인. `pnpm test` 만 호출하면
      # package.json `"test": "vitest run"` 스크립트가 그대로 실행되어 의도대로 동작.
      - run: cd apps/web && pnpm test
      - name: Upload vitest HTML report
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: vitest-report
          path: apps/web/coverage/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────
  # 10. web-e2e (Story 0.5 — Playwright smoke, chromium only)
  # ─────────────────────────────────────────────────────────
  web-e2e:
    needs: setup
    runs-on: ubuntu-latest
    # cj-273b (D-CI-FUNC-5 web-e2e stage 1): mirror smoke-e2e Postgres +
    # dev_seed + uvicorn infra pattern (ci.yml:596-700). Local diagnostic
    # confirmed root cause: web-e2e job had no Postgres service → all
    # /api/v1/inventory/closing-guard/evaluate calls returned 503 →
    # closing-guard banner never visible → 4/4 closing-guard.spec.ts
    # tests failing (and likely many others). This change wires the
    # backend so Playwright tests run against a real FastAPI + Postgres
    # stack. Stage 2 (cj-273b-stage2) will address data-state gaps that
    # surface once the infra is in place.
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # cj-251 (D-CI-FUNC-5 PART 2): web-e2e job previously had no env block —
      # `pnpm dev` boots Next.js which calls `getSupabaseEnv()` and hard-throws
      # when NEXT_PUBLIC_SUPABASE_URL / ANON_KEY are empty. With the cj-250
      # instrumentation MODULE_NOT_FOUND fix in place, the next failure (run
      # 33507184865) was exposed: the dev server now boots but every page
      # render throws `NEXT_PUBLIC_SUPABASE_URL is required`. Placeholder
      # values are sufficient — apps/web/e2e/fixtures/supabase-test.ts
      # explicitly defers real Postgres wiring (rlsDb is a no-op stub reading
      # E2E_TENANT_ID only), so network calls to localhost:54321 are never
      # issued by the chromium smoke run. Mirrors the pattern apps/web/env.ts
      # uses for `NODE_ENV=test` mode (deterministic stub URL).
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-anon-key-stub"
      NEXT_PUBLIC_SUPPORT_EMAIL: "support@bizup.kr"
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: "ci"
      LOG_LEVEL: "WARNING"
      OTEL_SDK_DISABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # cj-273b (D-CI-FUNC-5): FastAPI backend env vars + base URL for
      # Next.js server-side /api/v1/* proxy (lib/server-api.ts → uvicorn
      # on 127.0.0.1:8765). Same DATABASE_URL/SUPABASE_JWT_SECRET contract
      # as smoke-e2e (ci.yml:613-620).
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:54322/postgres"
      SUPABASE_JWT_SECRET: "ci-only-jwt-secret-do-not-ship-1234567890"
      JWT_LEEWAY_SEC: "30"
      ENVIRONMENT: "ci"
      PIPA_REVIEW_COMPLETED: "true"
      NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8765"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: ".nvmrc" }
      - name: Enable corepack (provides pnpm from packageManager field)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with: { python-version-file: ".python-version" }
      - run: pip install uv==0.11.32
      # cj-style 223 (D-CI-FUNC-8 workspace sync fix): `uv sync --frozen`
      # at root installs only root dev group, missing apps/api runtime
      # deps (alembic, uvicorn). Without `--all-packages`, the
      # `Apply Alembic migration` + `Boot uvicorn` steps fail with
      # `Failed to spawn: alembic (os error 2)`. Same root cause as
      # smoke-e2e (ci.yml:629-632) + rls-tests.
      - run: uv sync --frozen --all-packages
      - name: Install psql + Playwright system dependencies
        run: |
          # cj-style 217 (D-CI-FUNC-5): split `--with-deps` into explicit
          # sudo apt-get step + plain `playwright install chromium` below.
          # Combined: psql (for supabase_ci_shim + alembic_version +
          # RLS policies) + Chromium native deps.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64
          psql --version
      # cj-style 224 (D-CI-FUNC-8 alembic_version VARCHAR(32) blocker):
      # alembic 1.18.5 hardcodes VARCHAR(32) for `alembic_version.
      # version_num` (alembic/ddl/impl.py:173), but `0001_tenants_users_
      # memberships_settings` (39 chars, first migration) exceeds 32
      # chars → `INSERT INTO alembic_version` fails. Pre-create with
      # VARCHAR(64) before `alembic upgrade head`. Same fix as
      # smoke-e2e (ci.yml:656-661) + rls-tests.
      - name: Apply Supabase CI shim (auth.jwt() stub + roles)
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -f supabase/policies/0000_supabase_ci_shim.sql
      - name: Pre-create alembic_version (VARCHAR(64))
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -c "CREATE TABLE IF NOT EXISTS alembic_version \
                (version_num VARCHAR(64) NOT NULL PRIMARY KEY)"
      - name: Apply Alembic migration
        run: uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Apply RLS policies
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -f supabase/policies/0001_rls_policies.sql
      # cj-277 (Epic 29+ OQ-3 wiring): pass --scenario all to dev_seed so the
      # cj-276 wired business-data scenario seeds (closing_guard_negative +
      # snapshot_persisted) AND any future cj-277/cj-278/cj-279 scenario
      # seeds land before V8 + Playwright run. Without --scenario, dev_seed
      # seeds identity only → Playwright specs cannot find expected banners
      # (closing-guard-negative.spec.ts + snapshot-persistence.spec.ts etc.).
      # D-WEB-E2E-1~6 ownership transferred to Epic 29+ spec implementation
      # (cj-274 honest-DEFER). Verification scope: cj-277 atomic single
      # sprint = docs + ci source change only — live CI run verification
      # of Playwright step 19 belongs to cj-278 P1 wire sprint scope.
      - name: Run dev seed (creates tenant + user + industry baseline + Epic 29+ scenario seeds)
        run: uv run python scripts/dev_seed.py --scenario all
      - name: Boot uvicorn (background)
        run: |
          mkdir -p /tmp/web-e2e
          nohup uv run uvicorn apps.api.main:app --host 127.0.0.1 --port 8765 \
            > /tmp/web-e2e/uvicorn.log 2>&1 &
          echo "uvicorn PID=$!"
          # Wait for /health to return 200.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health >/dev/null; then
              echo "uvicorn ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/health || (echo "uvicorn failed to start"; tail -50 /tmp/web-e2e/uvicorn.log; exit 1)
      # cj-style 219 (D-CI-FUNC-5 PARTIAL 잔여): `pnpm playwright install chromium` 는 pnpm shell
      # wrapper 를 경유하여 playwright binary 가 PATH 에서 발견 안 되는 경우 fail. `pnpm exec` 는
      # local node_modules/.bin 의 binary 를 직접 resolve 하므로 binary download 가 정상 진행.
      - run: cd apps/web && pnpm exec playwright install chromium
      # cj-276 (Epic 29+ Story 29.18): V8 1-won regression fixture runner.
      # Runs V8 pytest suite BEFORE Playwright execution as the first
      # regression gate (AD-5 engine purity + AD-16 snapshot contract).
      # Spec drift: cj-275 spec 29.18 says `tests/engine/v8_*.py` but
      # actual location is `tests/regression_v8/` (workspace root) with
      # `@pytest.mark.v8_regression` marker registered in pyproject.toml.
      # V8_FIXTURE_COUNT = 22 (12 V8 + 2 V3 + 4 V4/A11 + 4 11-3 reversal/
      # snapshot/reopen) — `-m v8_regression` covers all 22.
      - name: Run V8 fixture suite (1-won regression gate)
        run: uv run pytest tests/regression_v8/test_regression_v8_fixtures.py -m v8_regression -v --tb=short
      - run: cd apps/web && pnpm exec playwright test --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
      - name: Upload uvicorn log (debug aid)
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: web-e2e-uvicorn-log
          path: /tmp/web-e2e/uvicorn.log
          if-no-files-found: ignore
      - name: Kill uvicorn
        if: always()
        run: |
          pkill -f "uvicorn apps.api.main:app" || true

  # ─────────────────────────────────────────────────────────
  # 11. smoke-e2e (smoke-fix sprint 2026-08-18 — T6)
  #
  # Drives the MVP critical path over real HTTP against a fresh
  # Postgres + alembic + RLS + dev_seed. Catches runtime regressions
  # that pure unit tests miss (typed exception → wrong status,
  # missing exception handlers, audit_emit wire breaks, V8
  # regression false-positives, smoke idempotency holes).
  # Cost: ~3-4 min wall-clock. PR gate.
  # ─────────────────────────────────────────────────────────
  smoke-e2e:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:54322/postgres"
      SUPABASE_JWT_SECRET: "ci-only-jwt-secret-do-not-ship-1234567890"
      JWT_LEEWAY_SEC: "30"
      LOG_LEVEL: "WARNING"
      ENVIRONMENT: "ci"
      PIPA_REVIEW_COMPLETED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with: { python-version-file: ".python-version" }
      - run: pip install uv==0.11.32
      # cj-style 223 (D-CI-FUNC-8 workspace sync fix): same root cause as
      # rls-tests — `uv sync --frozen` at workspace root installs only root
      # dev group, missing apps/api runtime deps (alembic, uvicorn). Without
      # `--all-packages`, the `Apply Alembic migration` step fails with
      # `Failed to spawn: alembic (os error 2)`. Fix: `--all-packages` syncs
      # all workspace members so alembic + uvicorn become available.
      - run: uv sync --frozen --all-packages
      - name: Install psql
        run: |
          # cj-style 217 (D-CI-FUNC-6): explicit sudo + visible stderr + verification.
          # smoke-e2e job (Story 0.6 — smoke E2E). Same root cause as rls-tests —
          # `>/dev/null` swallowed diagnostics. The cj-215 live CI run showed both
          # jobs failing this step in <1s (run_id 33235390055, job_ids 11 + 13).
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version
      # cj-style 224 (D-CI-FUNC-8 alembic_version VARCHAR(32) blocker): same
      # root cause as rls-tests — alembic 1.18.5 hardcodes VARCHAR(32) for
      # auto-created `alembic_version.version_num` (alembic/ddl/impl.py:173),
      # but `0001_tenants_users_memberships_settings` (39 chars, first
      # migration) exceeds 32 chars, so `INSERT INTO alembic_version` fails.
      # Fix: pre-create `alembic_version` with VARCHAR(64) before `alembic
      # upgrade head` (CREATE TABLE IF NOT EXISTS makes alembic's auto-create
      # a silent no-op). Pure YAML-only — preserves all 59 revision IDs and
      # alembic graph topology from cj-222.
      - name: Apply Supabase CI shim (auth.jwt() stub + roles)
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -f supabase/policies/0000_supabase_ci_shim.sql
      - name: Pre-create alembic_version (VARCHAR(64))
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -c "CREATE TABLE IF NOT EXISTS alembic_version \
                (version_num VARCHAR(64) NOT NULL PRIMARY KEY)"
      - name: Apply Alembic migration
        run: uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Apply RLS policies
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -f supabase/policies/0001_rls_policies.sql
      - name: Run dev seed (creates tenant + user + industry baseline)
        run: uv run python scripts/dev_seed.py
      - name: Boot uvicorn (background)
        run: |
          mkdir -p /tmp/smoke
          nohup uv run uvicorn apps.api.main:app --host 127.0.0.1 --port 8765 \
            > /tmp/smoke/uvicorn.log 2>&1 &
          echo "uvicorn PID=$!"
          # Wait for /health to return 200.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health >/dev/null; then
              echo "uvicorn ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/health || (echo "uvicorn failed to start"; tail -50 /tmp/smoke/uvicorn.log; exit 1)
      - name: Run smoke E2E (expect 36/36)
        run: |
          PYTHONIOENCODING=utf-8 \
            uv run python scripts/smoke_e2e.py \
              --base-url http://127.0.0.1:8765 \
              --period-key 2026-08 \
            2>&1 | tee /tmp/smoke/smoke.log
          SMOKE_EXIT=${PIPESTATUS[0]}
          if [ $SMOKE_EXIT -ne 0 ]; then
            echo "::error::smoke_e2e.py exited with $SMOKE_EXIT"
            exit $SMOKE_EXIT
          fi
      - name: Upload smoke artifacts (logs)
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: smoke-e2e-artifacts
          path: |
            /tmp/smoke/uvicorn.log
            /tmp/smoke/smoke.log
          if-no-files-found: ignore
      - name: Kill uvicorn
        if: always()
        run: |
          pkill -f "uvicorn apps.api.main:app" || true