[project]
name = "costmgr-ports"
version = "0.1.0"
description = "bizup ports — cross-module interface contracts (UI/API/services)"
requires-python = ">=3.12,<3.13"
readme = "README.md"

# IMPORTANT: ports package may import only stdlib + typing.
# No DB, no web, no clock, no random.
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
